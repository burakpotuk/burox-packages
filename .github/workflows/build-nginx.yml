# Build and publish nginx. Versions come from recipes/nginx/versions.json.
#  - Run by hand: Actions > build-nginx > Run workflow
#  - Automatic: when recipes/nginx/versions.json changes on main
#  - Pull requests: build + smoke test only, nothing is published
name: build-nginx

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Sürümler (boş = versions.json'daki hepsi; örn. 1.30.8)"
        type: string
        default: ""
      force:
        description: "Zaten yayınlanmış sürümü silip yeniden derle"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - recipes/nginx/versions.json
  pull_request:
    paths:
      - recipes/nginx/**
      - deps/openssl/**
      - deps/pcre2/**
      - deps/zlib/**
      - scripts/**
      - .github/workflows/build-nginx.yml
      - .github/workflows/build-package.yml

permissions:
  contents: write

concurrency:
  group: build-nginx-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/build-package.yml
    with:
      package: nginx
      versions: ${{ inputs.versions || '' }}
      force: ${{ inputs.force == true }}
      publish: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
